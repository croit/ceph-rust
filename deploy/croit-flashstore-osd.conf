# Cross-process claim locks (adr 0649 am. 1): root-owned, group ceph writes, so the daemon (uid ceph), root
# croit-flashstore-tool and containers share one directory while PrivateTmp=true keeps /var/tmp private to the unit.
d /run/croit-flashstore-osd 1770 root ceph -
