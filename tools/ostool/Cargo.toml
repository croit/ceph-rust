[package]
name = "ostool"
version.workspace = true
edition.workspace = true
license = "LGPL-3.0-only"
publish.workspace = true

[lints]
workspace = true

[dependencies]
store = { version = "0.0.0", path = "../../services/osd/store" }
storeadapt = { version = "0.0.0", path = "../../services/osd/storeadapt" }
osd = { version = "0.0.0", path = "../../services/osd/osd" }
peering = { version = "0.0.0", path = "../../services/osd/peering" }
pgwire = { version = "0.0.0", path = "../../services/osd/pgwire" }
replwire = { version = "0.0.0", path = "../../services/osd/replwire" }
denc = { version = "0.0.0", path = "../../crates/denc" }
messages = { version = "0.0.0", path = "../../crates/messages" }
osdmap = { version = "0.0.0", path = "../../crates/osdmap" }
outfmt = { version = "0.0.0", path = "../../crates/outfmt" }
serde_json = "1.0.151"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.191"

[dev-dependencies]
bytes = "1.12.1"
