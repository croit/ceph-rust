[package]
name = "dpdk-link"
version.workspace = true
edition.workspace = true
license = "MPL-2.0"
publish.workspace = true
# `links` makes cargo refuse a second package that links DPDK: this crate is the ONE owner of the native DPDK archives.
links = "dpdk"

[lints]
workspace = true

[features]
# Link the DPDK archives SPDK needs (rte_* list taken from SPDK's pkg-config files): crates/nvme feature `spdk`.
spdk = []
