[package]
name = "hwcheck"
version.workspace = true
edition.workspace = true
license = "LGPL-3.0-only"
publish.workspace = true
description = "Read-only host/hardware readiness check (croit-flashstore-osd --check, croit-flashstore-tool hwcheck; adr 0166)"

[lints]
workspace = true

[features]
# Build-info markers: the binary forwards its own feature set so the report can say which tiers are compiled in.
knet = ["dep:rt", "rt/knet"]
spdk = []
mimalloc = []
elastic = []
lab = []

[dependencies]
outfmt = { path = "../outfmt" }
osddir = { path = "../../services/osd/osddir" }
serde_json = "1.0.151"
rt = { path = "../rt", optional = true }
nvme = { path = "../nvme", features = ["kprobe"] }
uring-access = { path = "../uring-access" }
serde = { version = "1.0.229", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

[dev-dependencies]
tempfile = "3.27.0"
